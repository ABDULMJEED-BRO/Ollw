workflows:
  native-ios-build:
    name: iOS Build Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Set permissions and build
        script: |
          # البحث عن ملف البناء وتشغيله أينما كان داخل المجلدات
          find . -name "Build.command" -exec chmod +x {} \;
          find . -name "Build.command" -exec {} \;
    artifacts:
      - "*.ipa"
      - "build/*.ipa"
      - "**/*.ipa"
